<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Two devices syncing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    :root { --dur: 4s; }
    .flow { opacity: 0; animation: flow var(--dur) ease-in-out infinite; }
    @keyframes flow {
      0%, 8% { opacity: 0; }
      16%, 46% { opacity: 1; }
      56%, 100% { opacity: 0; }
    }
    .dash { stroke-dasharray: 4 8; animation: dash 0.8s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -12; } }

    .p { animation: move 0.8s cubic-bezier(.45,0,.55,1) infinite; opacity: 0; }
    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: 0.2s; }
    .p3 { animation-delay: 0.4s; }
    .p4 { animation-delay: 0.6s; }
    @keyframes move {
      0% { transform: translateX(0); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(74px); opacity: 0; }
    }

    .wave { transform-box: fill-box; transform-origin: center; opacity: 0; animation: wave var(--dur) ease-out infinite; }
    .wave.r { animation-name: waveR; }
    @keyframes wave {
      0%, 8% { opacity: 0; transform: scale(0.85); }
      18% { opacity: 0.5; }
      40%, 100% { opacity: 0; transform: scale(1.15); }
    }
    @keyframes waveR {
      0%, 40% { opacity: 0; transform: scale(0.85); }
      50% { opacity: 0.5; }
      70%, 100% { opacity: 0; transform: scale(1.15); }
    }

    .row-new { opacity: 0; animation: rowIn var(--dur) ease-in-out infinite; }
    .r1 { --s: 26%; }
    .r2 { --s: 34%; }
    .r3 { --s: 42%; }
    .row-new.r1 { animation-name: rowIn1; }
    .row-new.r2 { animation-name: rowIn2; }
    .row-new.r3 { animation-name: rowIn3; }
    @keyframes rowIn1 { 0%, 26% { opacity: 0; transform: translateY(4px); } 32%, 88% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    @keyframes rowIn2 { 0%, 34% { opacity: 0; transform: translateY(4px); } 40%, 88% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    @keyframes rowIn3 { 0%, 42% { opacity: 0; transform: translateY(4px); } 48%, 88% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }

    .badge { transform-origin: 200px 200px; opacity: 0; animation: badge var(--dur) cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes badge {
      0%, 54% { opacity: 0; transform: scale(0.4); }
      64% { opacity: 1; transform: scale(1); }
      88% { opacity: 1; transform: scale(1); }
      96%, 100% { opacity: 0; transform: scale(0.9); }
    }
    .ring { transform-origin: 200px 200px; opacity: 0; animation: ring var(--dur) ease-out infinite; }
    @keyframes ring {
      0%, 56% { opacity: 0; transform: scale(0.8); }
      62% { opacity: 0.45; }
      82%, 100% { opacity: 0; transform: scale(1.7); }
    }
    .tick { stroke-dasharray: 22; stroke-dashoffset: 22; animation: tick var(--dur) ease-out infinite; }
    @keyframes tick {
      0%, 60% { stroke-dashoffset: 22; }
      70%, 88% { stroke-dashoffset: 0; }
      96%, 100% { stroke-dashoffset: 22; }
    }
    .glowR { opacity: 0; animation: glowR var(--dur) ease-in-out infinite; }
    @keyframes glowR {
      0%, 50% { opacity: 0; }
      66%, 86% { opacity: 0.5; }
      96%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .badge, .row-new { opacity: 1 !important; }
    }
  </style>

  <!-- Soft ambient blobs (subtle) -->
  <ellipse cx="200" cy="330" rx="130" ry="10" fill="#0F172A" opacity="0.05" filter="url(#glow)"/>

  <!-- LEFT PHONE (current device) -->
  <g filter="url(#shadow)">
    <rect x="55" y="100" width="100" height="200" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  </g>
  <rect x="63" y="108" width="84" height="184" rx="13" fill="#F8FAFC"/>
  <rect x="93" y="113" width="24" height="5" rx="2.5" fill="#E2E8F0"/>
  <rect x="71" y="128" width="30" height="6" rx="3" fill="#CBD5E1"/>

  <g>
    <rect x="71" y="146" width="68" height="30" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="86" cy="161" r="6" fill="#10B981"/>
    <path d="M83.2 161.2l2 2 3.6-3.8" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="98" y="156" width="32" height="4.5" rx="2.25" fill="#D1D5DB"/>
    <rect x="98" y="164" width="20" height="4" rx="2" fill="#E5E7EB"/>

    <rect x="71" y="184" width="68" height="30" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="86" cy="199" r="5.5" fill="none" stroke="#A7F3D0" stroke-width="1.6"/>
    <rect x="98" y="194" width="30" height="4.5" rx="2.25" fill="#D1D5DB"/>
    <rect x="98" y="202" width="22" height="4" rx="2" fill="#E5E7EB"/>

    <rect x="71" y="222" width="68" height="30" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="86" cy="237" r="5.5" fill="none" stroke="#A7F3D0" stroke-width="1.6"/>
    <rect x="98" y="232" width="34" height="4.5" rx="2.25" fill="#D1D5DB"/>
    <rect x="98" y="240" width="16" height="4" rx="2" fill="#E5E7EB"/>
  </g>
  <rect x="93" y="279" width="24" height="3.5" rx="1.75" fill="#CBD5E1"/>

  <!-- RIGHT PHONE (new device) -->
  <g filter="url(#shadow)">
    <rect x="245" y="100" width="100" height="200" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  </g>
  <rect x="253" y="108" width="84" height="184" rx="13" fill="#F8FAFC"/>
  <rect x="283" y="113" width="24" height="5" rx="2.5" fill="#E2E8F0"/>
  <rect x="261" y="128" width="30" height="6" rx="3" fill="#CBD5E1"/>

  <!-- placeholder skeleton rows (always visible, faint) -->
  <rect x="261" y="146" width="68" height="30" rx="9" fill="none" stroke="#E5E7EB" stroke-dasharray="3 4"/>
  <rect x="261" y="184" width="68" height="30" rx="9" fill="none" stroke="#E5E7EB" stroke-dasharray="3 4"/>
  <rect x="261" y="222" width="68" height="30" rx="9" fill="none" stroke="#E5E7EB" stroke-dasharray="3 4"/>

  <!-- rows that arrive -->
  <g class="row-new r1">
    <rect x="261" y="146" width="68" height="30" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="276" cy="161" r="6" fill="#10B981"/>
    <path d="M273.2 161.2l2 2 3.6-3.8" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="288" y="156" width="32" height="4.5" rx="2.25" fill="#D1D5DB"/>
    <rect x="288" y="164" width="20" height="4" rx="2" fill="#E5E7EB"/>
  </g>
  <g class="row-new r2">
    <rect x="261" y="184" width="68" height="30" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="276" cy="199" r="5.5" fill="none" stroke="#A7F3D0" stroke-width="1.6"/>
    <rect x="288" y="194" width="30" height="4.5" rx="2.25" fill="#D1D5DB"/>
    <rect x="288" y="202" width="22" height="4" rx="2" fill="#E5E7EB"/>
  </g>
  <g class="row-new r3">
    <rect x="261" y="222" width="68" height="30" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="276" cy="237" r="5.5" fill="none" stroke="#A7F3D0" stroke-width="1.6"/>
    <rect x="288" y="232" width="34" height="4.5" rx="2.25" fill="#D1D5DB"/>
    <rect x="288" y="240" width="16" height="4" rx="2" fill="#E5E7EB"/>
  </g>
  <rect x="283" y="279" width="24" height="3.5" rx="1.75" fill="#CBD5E1"/>
  <rect x="245" y="100" width="100" height="200" rx="20" fill="none" stroke="#10B981" stroke-width="2" class="glowR"/>

  <!-- Waves emitting from phones -->
  <rect class="wave" x="47" y="92" width="116" height="216" rx="26" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <rect class="wave r" x="237" y="92" width="116" height="216" rx="26" fill="none" stroke="#10B981" stroke-width="1.5"/>

  <!-- Connection flow -->
  <g class="flow">
    <path class="dash" d="M162 200 H238" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <g fill="#10B981">
      <circle class="p p1" cx="163" cy="200" r="3.5"/>
      <circle class="p p2" cx="163" cy="194" r="2.5" opacity="0.8"/>
      <circle class="p p3" cx="163" cy="206" r="3"/>
      <circle class="p p4" cx="163" cy="200" r="2"/>
    </g>
  </g>

  <!-- Success badge -->
  <circle class="ring" cx="200" cy="200" r="20" fill="none" stroke="#10B981" stroke-width="2"/>
  <g class="badge">
    <circle cx="200" cy="200" r="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="200" cy="200" r="16" fill="#10B981"/>
    <path class="tick" d="M192 200.5l5.5 5.5 10.5-11" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
