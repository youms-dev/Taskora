<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Two devices syncing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --dur: 4s; }

    .progress { stroke-dasharray: 80; stroke-dashoffset: 80; opacity: 0; animation: progress var(--dur) ease-in-out infinite; }
    @keyframes progress {
      0%, 10% { stroke-dashoffset: 80; opacity: 1; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      56% { stroke-dashoffset: 0; opacity: 1; }
      62%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .dot { opacity: 0; animation: dot var(--dur) ease-in-out infinite; }
    @keyframes dot {
      0%, 10% { transform: translateX(0); opacity: 0; }
      14% { opacity: 1; }
      46% { opacity: 1; }
      50%, 100% { transform: translateX(80px); opacity: 0; }
    }

    .row { opacity: 0; }
    .r1 { animation: r1 var(--dur) ease-out infinite; }
    .r2 { animation: r2 var(--dur) ease-out infinite; }
    .r3 { animation: r3 var(--dur) ease-out infinite; }
    @keyframes r1 { 0%, 30% { opacity: 0; } 36%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes r2 { 0%, 38% { opacity: 0; } 44%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes r3 { 0%, 46% { opacity: 0; } 52%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }

    .badge { transform-origin: 200px 200px; opacity: 0; animation: badge var(--dur) ease-out infinite; }
    @keyframes badge {
      0%, 54% { opacity: 0; transform: scale(0.7); }
      62% { opacity: 1; transform: scale(1); }
      90% { opacity: 1; transform: scale(1); }
      97%, 100% { opacity: 0; transform: scale(1); }
    }
    .tick { stroke-dasharray: 20; stroke-dashoffset: 20; animation: tick var(--dur) ease-out infinite; }
    @keyframes tick {
      0%, 58% { stroke-dashoffset: 20; }
      68%, 90% { stroke-dashoffset: 0; }
      97%, 100% { stroke-dashoffset: 20; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .row, .badge { opacity: 1 !important; }
      .tick { stroke-dashoffset: 0 !important; }
    }
  </style>

  <!-- Left phone -->
  <rect x="60" y="105" width="90" height="190" rx="16" fill="#000000"/>
  <rect x="66" y="111" width="78" height="178" rx="11" fill="#000000"/>
  <rect x="94" y="116" width="22" height="4" rx="2" fill="rgba(255,255,255,.2)"/>
  <g fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.5">
    <circle cx="80" cy="152" r="5"/>
    <circle cx="80" cy="190" r="5"/>
    <circle cx="80" cy="228" r="5"/>
  </g>
  <g fill="rgba(255,255,255,.2)">
    <rect x="93" y="148" width="42" height="4" rx="2"/>
    <rect x="93" y="156" width="26" height="3.5" rx="1.75"/>
    <rect x="93" y="186" width="36" height="4" rx="2"/>
    <rect x="93" y="194" width="24" height="3.5" rx="1.75"/>
    <rect x="93" y="224" width="40" height="4" rx="2"/>
    <rect x="93" y="232" width="20" height="3.5" rx="1.75"/>
  </g>

  <!-- Right phone -->
  <rect x="250" y="105" width="90" height="190" rx="16" fill="#000000"/>
  <rect x="256" y="111" width="78" height="178" rx="11" fill="#000000"/>
  <rect x="284" y="116" width="22" height="4" rx="2" fill="rgba(255,255,255,.2)"/>

  <g class="row r1">
    <circle cx="270" cy="152" r="5" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
    <rect x="283" y="148" width="42" height="4" rx="2" fill="rgba(255,255,255,.2)"/>
    <rect x="283" y="156" width="26" height="3.5" rx="1.75" fill="rgba(255,255,255,.2)"/>
  </g>
  <g class="row r2">
    <circle cx="270" cy="190" r="5" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
    <rect x="283" y="186" width="36" height="4" rx="2" fill="rgba(255,255,255,.2)"/>
    <rect x="283" y="194" width="24" height="3.5" rx="1.75" fill="rgba(255,255,255,.2)"/>
  </g>
  <g class="row r3">
    <circle cx="270" cy="228" r="5" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
    <rect x="283" y="224" width="40" height="4" rx="2" fill="rgba(255,255,255,.2)"/>
    <rect x="283" y="232" width="20" height="3.5" rx="1.75" fill="rgba(255,255,255,.2)"/>
  </g>

  <!-- Connection -->
  <path d="M160 200 H240" stroke="#E4E4E7" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path class="progress" d="M160 200 H240" stroke="#10B981" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle class="dot" cx="160" cy="200" r="4" fill="#10B981"/>

  <!-- Success -->
  <g class="badge">
    <circle cx="200" cy="200" r="19" fill="#FFFFFF"/>
    <circle cx="200" cy="200" r="14" fill="#10B981"/>
    <path class="tick" d="M193.5 200.5l4.5 4.5 8.5-9" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
